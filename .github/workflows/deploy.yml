name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t syedarbaazmohiuddin/demo-car-api:latest .

      - name: Push Docker Image
        run: |
          docker push syedarbaazmohiuddin/demo-car-api:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull syedarbaazmohiuddin/demo-car-api:latest

            docker stop car-api || true
            docker rm car-api || true

            docker run -d \
              --name car-api \
              --restart always \
              --env-file ~/.env \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
              -p 8080:8080 \
              syedarbaazmohiuddin/demo-car-api:latest